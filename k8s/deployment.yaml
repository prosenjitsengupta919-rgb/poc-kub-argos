apiVersion: apps/v1
kind: Deployment
metadata:
  name: poc-kub-argos
  labels:
    app: poc-kub-argos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: poc-kub-argos
  template:
    metadata:
      labels:
        app: poc-kub-argos
    spec:
      containers:
        - name: web
          image: poc-kub-argos:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
